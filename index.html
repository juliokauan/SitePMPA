<!DOCTYPE html>
<html lang = "pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Site PMPA</title>
    <link rel="stylesheet" href="assets/css/pages/index/index.css"/>
  </head>
  <body>
    <main>
    <h1>Cálculo de Tempo de Serviço</h1>
    <form action = "resposta.html" id = "formulario">
      <div id = "div_inclusao" class = "div_container"> 
        <label for = "inclusao" class = "style_label">Data de Inclusão do Militar</label>
        <input type = "date" name = "inclusao" id = "inclusao" class = "container_datas">
      </div>
      <div id = "div_genero" class = "div_container">
        <label for = "genero" class = "style_label">Gênero do Militar</label>
        <input type = "radio" name = "genero" id = "genero_masc" value = "masculino"> <label for = "genero_masc">Masculino</label>
        <input type = "radio" name = "genero" id = "genero_fem" value = "feminino" class = "container_radio"> <label for = "genero_fem">Feminino</label>
      </div>
      <div id = "div_requerimento" class = "div_container">
        <label for = "requerimento" class = "style_label">Data do Requerimento</label>
        <input type = "date" name = "requerimento" id = "requerimento" class = "container_datas">
      </div>
      <div id = "div_promocao" class = "div_container">
        <label for = "promocao" class = "style_label">Última promoção do Militar</label>
        <input type = "date" name = "promocao" id = "promocao" class = "container_datas">
      </div>
      <div id = "div_patente" class = "div_container">
        <label for = "patente" class = "style_label">Posto ou Graduação atual do Militar</label>
        <input type = "radio" name = "patente" id = "patente_cb" value = "soldado_cabo"> <label for = "patente_cb">Soldado ou Cabo</label>
        <input type = "radio" name = "patente" id = "patente_3sgt" value = "3sgt_superior" class = "container_radio"> <label for = "patente_3sgt">3° Sargento ou Superior</label>
      </div>
      <div id = "div_averb_escolha" class = "div_container">
        <label for = "escolha_averb" class = "style_label">O Militar possui averbação?</label>
        <select name="escolha_averb" id="escolha_averb" class = "container_averb_escolha">
          <option value = "sem_averb">Não possui</option>
          <option value = "apenas_forcas_armadas">Apenas Forças Armadas</option>
          <option value = "apenas_privada">Apenas Empresas Privadas</option>
          <option value = "forcas_e_empresas">Forças Armadas e Empresas Privadas</option>
        </select>
      </div>
      <div id = "div_averb_forca" class = "div_container">
        <label for = "ano_forcas" class = "style_label">Insira o tempo de averbação em Forças Armadas</label>
        <label for = "ano_forcas">Anos: </label>
        <input type="number" name="ano_forcas" id="ano_forcas" class = "container_input_averb" value="0"/>
        <label for = "mes_forcas">Mêses: </label>
        <input type="number" name="mes_forcas" id="mes_forcas" class = "container_input_averb" value="0"/>
        <label for = "dias_forcas">Dias: </label>
        <input type="number" name="dias_forcas" id="dias_forcas" class = "container_input_averb" value="0"/>
      </div>
      <div id = "div_averb_privada" class = "div_container">
        <label for = "ano_privada" class = "style_label">Insira o tempo de averbação em Empresas Privadas</label>
        <label for = "ano_privada">Anos: </label>
        <input type="number" name="ano_privada" id="ano_privada" class = "container_input_averb" value="0"/>
        <label for = "mes_privada">Mêses: </label>
        <input type="number" name="mes_privada" id="mes_privada" class = "container_input_averb" value="0"/>
        <label for = "dias_privada">Dias: </label>
        <input type="number" name="dias_privada" id="dias_privada" class = "container_input_averb" value="0"/>
      </div>
      <div id = "div_tempofora_escolha" class = "div_container">
        <label for = "tempoFora" class = "style_label">O Militar possui tempo afastado do Serviço?</label>
        <input type = "radio" name = "tempoFora" id = "tempoforaSim" value = "tempoforaSim">
        <label for = "tempoforaSim">Sim</label>
        <input type = "radio" name = "tempoFora" id = "tempoforaNao" value = "tempoforaNao" class = "container_radio" checked> <label for = "tempoforaNao">Não</label>
      </div>
      <div id = "div_tempofora" class = "div_container">
        <label for = "ano_tempofora" class = "style_label">Insira o tempo de afastamento do Militar</label>
        <label for = "ano_tempofora">Anos: </label>
        <input type="number" name="ano_tempofora" id="ano_tempofora" class = "container_input_averb" value="0"/>
        <label for = "mes_tempofora">Mêses: </label>
        <input type="number" name="mes_tempofora" id="mes_tempofora" class = "container_input_averb" value="0"/>
        <label for = "dias_tempofora">Dias: </label>
        <input type="number" name="dias_tempofora" id="dias_tempofora" class = "container_input_averb" value="0"/>
      </div>
      <input type="submit" name="button_Formulario" id="button_Formulario" value="Calcular"/>
    </form>
    </main>
    <script src = "assets/js/pages/index/index.js"></script>
  </body>
</html>
